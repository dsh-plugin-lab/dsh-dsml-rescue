# Release: the only way anything is published. Two equivalent entry points.
#   ①  push a tag — `git push origin v<version>`
#   ②  dispatch by hand — Actions → Release → Run workflow (or `gh workflow run release.yml`)
# Both enter the same job, and the all-or-nothing order is the same.
#
# **No input parameter** except `force` — the version comes from package.json, and the tier is chosen
# when it is bumped locally.
#
# Changing this file means **dispatching it once for real**: pull request CI only runs ci.yml, so a
# green check on a pull request that touches release.yml says nothing about whether the release path
# works.
#
# ## What this flow guarantees (cross-repository agreement)
#
# 1. **Both entry points.** A tag trigger carries its own gate: the tag name must equal `v` plus the
#    version in package.json. Without it you get "tag says v0.3.0, what ships is 0.2.0" — the hardest
#    kind of mismatch, and npm versions cannot be overwritten. The manual dispatch has no such gate
#    (its meaning is "ship the number in the manifest", and the flow creates the tag).
# 2. **The release body comes from the Release Drafter draft**, falling back to `--generate-notes`
#    when there is no draft. Never from commits alone.
# 3. **The draft is retired afterwards**, or the next release reads the previous batch's body.
# 4. **npm publishing goes through OIDC** (Trusted Publishing), no long-lived token in this repository.
#
# ## Deliberately **not** uniform across repositories
#
# The check chain before publish, the environment name, the retry policy, whether a GitHub App token
# is needed to push to the default branch — all of these are this repository's own business. They
# are marked with a comment where they occur; changing one is a local decision.
#
# ## All or nothing
#
# Publish first, then the commit, then the tag and the Release. If any step goes red, the remote
# keeps no residue — never a tag without a version.
#
# ## Idempotent
#
# Re-running does not publish twice: when the target version is already on npm, publish is skipped
# and only the git side is completed (one re-run repairs "published but the push failed").
#
# ## Version-driven: this flow does **not** bump the version
#
# What ships is the number in package.json. Bumping is a separate step **before** the release, because
# the version shown in the interface is that same number — a flow that bumps it itself leaves the
# working tree permanently on "the last published version", so a screenshot taken afterwards shows a
# stale number. `scripts/check-release.mjs` asserts this, and it runs on every `pnpm run check`.
#
# ## Prereleases
#
# A version carrying a prerelease segment (2.0.0-alpha.1) publishes to the dist-tag of the same name
# (alpha) and leaves `latest` alone. The criterion is the **resulting version**, never an input, so
# the publish step and the Release step read the same output.
#
# **Tag name = `v` plus the version in package.json** (v2.0.0-alpha.1). The prefix is added
# **explicitly** rather than derived — `npm version`'s output carries the `v`, the manifest does not.
# The guard reads tags with `git describe --match 'v[0-9]*'`, so it **cannot see** a tag without it.
#
# ## Authentication
#
# npm Trusted Publishing (OIDC): no token is passed at any point. The cost is a one-time
# Trusted Publisher on npmjs.com for this package (repository, workflow filename, environment all
# have to match); the benefit is that this repository stores no long-lived credential.
name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the "no behaviour change, no release" guard (only for a release that carries docs or tooling only)'
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write # push the commit, create the tag and the Release
  id-token: write # npm Trusted Publishing and provenance need OIDC

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment name configured on the npm side must match this word for word, or the OIDC
    # claims will not match the Trusted Publisher and publishing fails with a 404.
    environment: release

    steps:
      # A manual dispatch accepts only the default branch. A tag trigger necessarily points at a
      # commit, and the tag/version gate below is what governs it — without the event_name test the
      # ref is refs/tags/... and this step would fail every tag-triggered release.
      - name: Verify this dispatch came from the default branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::a release may only be dispatched from main; the current ref is ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the guard diffs the previous tag; --generate-notes needs the full history

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Whether the changes since the last tag touch the published artifact at all.
      #
      # The baseline must **exclude the tag being released**: on a tag trigger HEAD *is* the tagged
      # commit, and without the exclusion `describe` resolves to that tag itself, `<tag>..HEAD` comes
      # out empty, and a perfectly normal release is judged as "nothing to release". Measured — a
      # repository that only ever dispatched manually never hit it; the first tag push did.
      # On a dispatch the tag does not exist yet, so the exclusion is a no-op.
      - name: Guard against release noise
        if: inputs.force != true
        run: |
          exclude=""
          if [ "${{ github.event_name }}" = "push" ]; then exclude="--exclude=${{ github.ref_name }}"; fi
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' $exclude 2>/dev/null || true)
          if [ -z "$base" ]; then
            echo "no earlier tag: the first release is not subject to the guard."
            exit 0
          fi
          changed=$(git diff --name-only "$base..HEAD")
          if [ -z "$changed" ]; then
            echo "::error::no changes at all since $base; there is nothing to release."
            exit 1
          fi
          echo "changes in $base..HEAD:"
          printf '%s\n' "$changed" | node scripts/release-guard.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - run: pnpm run typecheck

      # Order is fixed: lib/ is a build artifact, and a test that reads it cannot pass before
      # it exists.
      - name: Build (produces lib/)
        run: pnpm run build

      - run: pnpm run test

      # The release-state invariants. `lib/` is a build artifact that is not in the checkout, so the
      # step above has to build before this can look at anything real.
      - name: Release-state check
        run: pnpm run check:release

      # The tag trigger's own gate: the tag name must be `v` plus the manifest version.
      # Without it you get "the tag says v0.3.0, what ships is 0.2.0" — and npm versions cannot be
      # overwritten afterwards.
      - name: Verify the pushed tag matches the manifest version
        if: github.event_name == 'push'
        run: |
          want="v$(node -p "require('./package.json').version")"
          got="${{ github.ref_name }}"
          if [ "$got" != "$want" ]; then
            echo "::error::$got was pushed while package.json is $want — the tag and the manifest must agree"
            exit 1
          fi
          echo "$got matches the manifest; continuing."

      - name: Read the version to publish
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          dist_tag=$(node -p "const v=require('./package.json').version; const m=/^[0-9]+\.[0-9]+\.[0-9]+-([A-Za-z][0-9A-Za-z-]*)(?:\.[0-9A-Za-z-]+)*$/.exec(v); m ? m[1] : ''")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "releasing $version (dist-tag: ${dist_tag:-default latest})"

      # Idempotency: when this version is already on npm, skip publish and only complete the git side,
      # so a re-run repairs "published but the push failed". Forgetting to bump shows up here as
      # "this number is already on npm" — which is the honest symptom, rather than shipping an
      # identical package under a new number.
      - name: Check whether that version is already on npm
        id: probe
        run: |
          if npm view "dsh-plugin-sample@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::${{ steps.version.outputs.version }} is already on npm: skipping publish and completing only the git side"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # The bump happened in a local commit before this flow ran; this only catches leftovers.
      - name: Commit any remaining manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "the working tree has no changes (version-driven: the bump is in a local commit), skipping the commit"
          else
            git add -A
            git commit -m "chore: commit manifest state for release ${{ steps.version.outputs.version }}"
          fi

      - name: Publish to npm
        if: steps.probe.outputs.published == 'false'
        # Authentication is OIDC: the npm CLI fetches a short-lived credential itself, no token at any
        # point. Without `id-token: write`, or with a Trusted Publisher that does not match this
        # repository / filename / environment, this step fails.
        # --provenance is redundant under OIDC and stays as a sentinel: an environment that cannot
        # produce provenance goes red.
        # The prerelease goes to its own dist-tag (alpha) and leaves latest on the last stable one.
        run: |
          if [ -n "${{ steps.version.outputs.dist_tag }}" ]; then
            pnpm publish --provenance --access public --no-git-checks --tag "${{ steps.version.outputs.dist_tag }}"
          else
            pnpm publish --provenance --access public --no-git-checks
          fi

      # The git side of a release: tag plus GitHub Release. **Both are produced by the flow**, so no
      # one has to remember to add them afterwards.
      # The tag name is `v` plus the manifest version, the prefix added explicitly: `npm version`'s
      # output carries the `v`, the manifest does not, and the guard's `git describe --match` cannot
      # see a tag without it.
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Same criterion as publish (a prerelease segment means prerelease), never an input.
          extra=""
          if [ -n "${{ steps.version.outputs.dist_tag }}" ]; then extra="--prerelease"; fi
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, skipping the tag."
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "the Release for $tag already exists, skipping."
            exit 0
          fi

      # The body has two sources: **the draft, falling back to `--generate-notes`**.
      #
      # The draft is maintained by Release Drafter (the config lives in the organization repository;
      # its tag is the rolling name `next`, which never collides with `v<version>` — that is why the
      # existence check above does not hit the draft).
      #
      # **"Was the draft actually read?" has to be asserted.** Both "no draft" and "cannot read the
      # draft" fall back, but the first is normal and the second is **broken configuration** (tag
      # renamed, the action never ran, permissions missing). Without the distinction, "the release
      # succeeded but the body came from the fallback" is a silent failure.
      #
      # The cleanup matches on the action's name and **not** on the full sentence of that notice:
      # the wording belongs to the organization template and gets rewritten; copying it verbatim
      # turns into a sed that fails silently the moment it does.
      - name: Pick the release body (draft first, then --generate-notes)
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft="$(gh release view next --json body --jq '.body' 2>/dev/null || true)"
          if printf '%s' "$draft" | grep -q 'Release Drafter'; then
            # One line, matched by name: that line says "draft" in a published release and is false.
            printf '%s\n' "$draft" | sed '/Release Drafter/d' > /tmp/notes.md
            # The draft may have a heading and no entries (no pull requests this round): that still
            # counts as "read but empty", so it falls back.
            if [ -n "$(grep -E '^[-*] ' /tmp/notes.md || true)" ]; then
              echo "source=draft" >> "$GITHUB_OUTPUT"
              echo "::notice::the body comes from the Release Drafter draft (next)"
            else
              echo "source=generate" >> "$GITHUB_OUTPUT"
              echo "::notice::the draft was read but has no entries (no labelled pull requests this round), falling back to --generate-notes"
            fi
          else
            echo "source=generate" >> "$GITHUB_OUTPUT"
            echo "::warning::cannot read the Release Drafter draft (next) — falling back to --generate-notes."
            echo "::warning::if the configuration is broken (tag renamed / the action never ran / permissions missing), this warning is the only signal."
          fi

      - name: Create the GitHub Release
        if: steps.probe.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          case "${{ steps.version.outputs.version }}" in
            *-*) flags="--prerelease" ;;
            *)   flags="" ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "the Release for $tag already exists, skipping."
          else
            echo "creating the Release: $tag $flags (body source: ${{ steps.notes.outputs.source }})"
            if [ "${{ steps.notes.outputs.source }}" = "draft" ]; then
              gh release create "$tag" --title "$tag" $flags --notes-file /tmp/notes.md
            else
              gh release create "$tag" --title "$tag" $flags --generate-notes
            fi
          fi

      # Once the body has been taken, **the draft has to give way**, or the next release reads the
      # previous batch's body.
      #
      # Release Drafter uses "the most recent formal release" as its dividing line and does not track
      # which draft was consumed. The consequence is not an empty draft but a **stale** one — measured:
      # after 0.3.0 shipped, `next` still held the batch from before 0.3.0 — so the body is the
      # **previous** batch's while the draft looks perfectly fine. That is a silent mismatch.
      #
      # The condition must match the `Create` step above, otherwise a skip leaves the body unconsumed
      # and that batch's notes are lost for good.
      #
      # Only the one draft whose tag does not start with `v` is deleted: no title matching, and no
      # formal `v<version>` release is touched (`gh release delete` removes the tag by default, so
      # that is explicitly turned off here).
      - name: Retire the drafter's next draft
        if: steps.probe.outputs.published == 'false' && steps.notes.outputs.source == 'draft'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft_tag="$(gh release list --limit 30 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft) | .tagName] | map(select(startswith("v") | not)) | .[0] // ""')"
          if [ -n "$draft_tag" ]; then
            gh release delete "$draft_tag" --yes --cleanup-tag=false
            echo "deleted the draft $draft_tag (Release Drafter rebuilds it after the next merge)"
          fi
