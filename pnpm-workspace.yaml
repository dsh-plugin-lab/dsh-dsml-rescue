# pnpm workspace root. Declared even with a single package — otherwise pnpm treats this as a
# non-workspace directory and the dependency tree stops matching the one CI installs.
packages:
  - '.'

# minimumReleaseAgeExclude：pnpm 11 的供应链门禁默认拒绝「发布不足 24 小时」的版本，而本插件跟的是
# 宿主的 rc 线 —— 刚发布的 rc 天然落在 24 小时内，不放行就装不上（本机与 CI 同样停在 install，
# 报 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION）。
#
# 逐条列出被拒的那批宿主包，而不是把整道门禁关掉：门禁对**其余每个包**继续生效，这正是它该管的地方。
# 代价是每次抬宿主线都要往这里补一轮 —— 但那条清单是装依赖时 pnpm 自己报出来的，照抄即可。
# 姊妹仓 dsh-workbuddy-bridge 选了另一种写法（`minimumReleaseAge: 0`）并记了理由，两种都成立。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.2-rc.3'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.3'
  - '@deepseek-ai/dsh-error@0.2.2-rc.3'
  - '@deepseek-ai/dsh-llm@0.2.2-rc.3'
  - '@deepseek-ai/dsh-scope@0.2.2-rc.3'
  - '@deepseek-ai/dsh-session-projection@0.2.2-rc.3'
  - '@deepseek-ai/dsh-session@0.2.2-rc.3'
  - '@deepseek-ai/dsh-system-prompt@0.2.2-rc.3'
  - '@deepseek-ai/dsh-timeout@0.2.2-rc.3'
  - '@deepseek-ai/dsh-typert-protocol@0.2.2-rc.3'
  - '@deepseek-ai/dsh-util-crypto@0.2.2-rc.3'
  - '@deepseek-ai/dsh-util-values@0.2.2-rc.3'
